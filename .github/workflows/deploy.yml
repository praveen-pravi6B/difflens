name: Render Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Install Playwright browsers
        run: npx playwright install --install-deps
        
      - name: Start server (background)
        run: |
          PORT=4173 HOST=127.0.0.1 node server.js &
          echo "SERVER_PID=$!"
          sleep 10
          
      - name: Run smoke test
        run: npm run smoke
        
      - name: Deploy to Render
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/actions-deploy@v1
        # Note: Render has its own deployment flow,
        # this is a placeholder for the deployment step
